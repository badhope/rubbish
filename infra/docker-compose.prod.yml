# Rubbish production stack — Postgres + Meilisearch + Backend + Frontend + Caddy.
#
# Prerequisites:
#   1. A server with Docker + Docker Compose installed.
#   2. DNS A record pointing your domain to the server's IP.
#   3. A proper .env file with real secrets (see apps/backend/.env.example).
#
# Usage:
#   cp .env.example .env        # fill in real secrets
#   docker compose -f infra/docker-compose.prod.yml up -d
#   # Caddy auto-provisions Let's Encrypt certs for your domain.
#
# Upgrade:
#   docker compose -f infra/docker-compose.prod.yml pull
#   docker compose -f infra/docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rubbish
      POSTGRES_USER: rubbish
      POSTGRES_PASSWORD: ${RUBBISH_DB_PASSWORD:?RUBBISH_DB_PASSWORD is required — set it in repo-root .env}
      # superuser 绕过 RLS：initdb 阶段用该密码创建非 superuser 应用角色
      # rubbish_app。未设置则跳过创建（应用回退 superuser，启动日志告警）。
      RUBBISH_APP_DB_PASSWORD: ${RUBBISH_APP_DB_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./pg-init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rubbish"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: ${RUBBISH_MEILISEARCH_API_KEY:?RUBBISH_MEILISEARCH_API_KEY is required — set it in repo-root .env}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch_data:/meili_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7700/health | grep -q 'status.*available'"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    env_file:
      - ../.env
    environment:
      # 设置 RUBBISH_DB_APP_USER=rubbish_app + RUBBISH_APP_DB_PASSWORD 后
      # 应用改用非 superuser 角色连库，RLS 租户隔离才真正生效（superuser
      # 绕过 FORCE RLS）。未设置时回退 superuser，启动日志会告警。
      RUBBISH_DATABASE_URL: postgresql+asyncpg://${RUBBISH_DB_APP_USER:-rubbish}:${RUBBISH_APP_DB_PASSWORD:-${RUBBISH_DB_PASSWORD}}@postgres:5432/rubbish
      RUBBISH_MEILISEARCH_URL: http://meilisearch:7700
      RUBBISH_MEILISEARCH_API_KEY: ${RUBBISH_MEILISEARCH_API_KEY:?RUBBISH_MEILISEARCH_API_KEY is required — set it in repo-root .env}
      RUBBISH_ENVIRONMENT: production
    # 迁移固定用 superuser（DDL 权限 + 表归其所有，initdb 的
    # ALTER DEFAULT PRIVILEGES 才能把新表授权给 rubbish_app）；
    # uvicorn 用 environment 里的 RUBBISH_DATABASE_URL（可为 rubbish_app）。
    command: >
      sh -c "RUBBISH_DATABASE_URL='postgresql+asyncpg://rubbish:${RUBBISH_DB_PASSWORD}@postgres:5432/rubbish'
      alembic upgrade head
      && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Optional observability stack — uncomment and configure when needed.
  # ------------------------------------------------------------------

