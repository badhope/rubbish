<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative grid -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Glow accent -->
  <circle cx="600" cy="315" r="300" fill="url(#glow)"/>

  <!-- Book icon -->
  <g transform="translate(490, 145)">
    <path d="M 0 30 L 0 220 L 110 240 L 220 220 L 220 30 L 110 50 Z" fill="url(#accent)" opacity="0.95"/>
    <path d="M 0 30 L 0 220 L 110 200 L 110 50 Z" fill="#3b82f6"/>
    <line x1="0" y1="30" x2="110" y2="50" stroke="#fff" stroke-width="2" opacity="0.5"/>
    <line x1="110" y1="50" x2="220" y2="30" stroke="#fff" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="220" x2="110" y2="240" stroke="#fff" stroke-width="2" opacity="0.5"/>
    <line x1="110" y1="240" x2="220" y2="220" stroke="#fff" stroke-width="2" opacity="0.5"/>
    <line x1="110" y1="50" x2="110" y2="240" stroke="#fff" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Title -->
  <text x="600" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="86" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="-2">
    ScholarLib
  </text>

  <!-- Subtitle -->
  <text x="600" y="495" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="26" font-weight="500" fill="#cbd5e1" text-anchor="middle">
    Open-Access Scholarly Library
  </text>

  <!-- Tagline -->
  <text x="600" y="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="400" fill="#94a3b8" text-anchor="middle">
    Computer Science · Economics · Management
  </text>

  <!-- URL badge -->
  <rect x="450" y="568" width="300" height="34" rx="17" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <text x="600" y="591" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace" font-size="16" font-weight="500" fill="#60a5fa" text-anchor="middle">
    badhope.github.io/ScholarLib
  </text>
</svg>
