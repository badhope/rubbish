name: Release

# Tag with `git tag v1.2.3 && git push --tags` to cut a release.
# Pulls the matching section from CHANGELOG.md as the body.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.2.3)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release notes from CHANGELOG.md
        run: |
          python3 - <<'PY' > /tmp/release-notes.md
          import os, re
          version = os.environ.get("VERSION") or "${{ steps.version.outputs.VERSION }}"
          with open("CHANGELOG.md", encoding="utf-8") as f:
              text = f.read()
          # Try a [Unreleased] section first, fall back to whatever's in the file.
          m = re.search(r"## \[Unreleased\]([\s\S]*?)(?=\n## \[|\Z)", text)
          body = m.group(1).strip() if m else text.strip()
          print(f"## {version}\n")
          print(body or "_No release notes._")
          PY

      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
          body_path: /tmp/release-notes.md
          files: LICENSE
