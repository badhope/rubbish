name: Security

# Runs secret scanning and dependency vulnerability audits on every push
# and weekly on Monday 06:00 UTC. Never publishes any results publicly.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # ── 1. GitLeaks — secret scanning ──────────────────────────────────────
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 2. npm audit — JS dependency vulnerabilities ──────────────────────
  npm-audit:
    name: npm audit (prod dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci --omit=optional

      - name: Audit production deps
        run: |
          # High+ severity only by default
          npm audit --omit=dev --audit-level=high || (
            echo "::error::npm audit found high-severity vulnerabilities in production deps"
            exit 1
          )

  # ── 3. Python dependency audit (if requirements.txt exists) ───────────
  python-audit:
    name: Python audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit requirements.txt
        if: hashFiles('requirements.txt') != ''
        run: |
          pip-audit --strict --requirement requirements.txt || (
            echo "::warning::pip-audit found vulnerabilities. Review and update requirements.txt."
            exit 0
          )

  # ── 4. Actionlint — workflow syntax check ──────────────────────────────
  actionlint:
    name: actionlint (workflow syntax)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.1
        with:
          args: -color
