name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Version consistency
        run: bash ../../scripts/check-version.sh
      - name: Install dependencies
        run: uv sync --group dev --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: >
          uv run mypy app
          --exclude 'app/domain/submission'
          --exclude 'app/domain/ingest'
          --exclude 'app/interfaces/http/submission'
          --exclude 'app/interfaces/http/review'
      - name: Tests
        run: uv run pytest -q -n auto

  migrations:
    name: Migrations and RLS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rubbish
          POSTGRES_PASSWORD: rubbish
          POSTGRES_DB: rubbish_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rubbish"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RUBBISH_DATABASE_URL: postgresql+asyncpg://rubbish:rubbish@localhost:5432/rubbish_ci
      RUBBISH_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --group dev --frozen
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Confirm head
        run: uv run alembic current
      - name: Row-level security tests
        run: uv run pytest -m pg -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build

  e2e:
    name: Browser smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    env:
      E2E_SPAWN_SERVER: "1"
      E2E_WORKERS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install frontend dependencies
        run: npm ci --registry=https://registry.npmjs.org
      - name: Install backend dependencies
        run: cd ../backend && uv sync --group dev --frozen
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run smoke suite
        run: npx playwright test
      - name: Upload failure traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            apps/frontend/playwright-report/
            apps/frontend/test-results/
          retention-days: 7

  security:
    name: Security scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --group dev --frozen
      - name: Bandit
        run: uv run bandit -r app -c pyproject.toml --severity-level medium

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
