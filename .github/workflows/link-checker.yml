name: Link Checker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci
      - run: pip install -r requirements.txt
      - run: npm run docs:build

      - name: Run lychee
        uses: lycheeverse/lychee-action@v2.8.0
        with:
          # Don't fail the workflow — link checks are advisory and can
          # flap on transient rate limits. The job summary still shows
          # the report so reviewers see the state.
          fail: false
          format: markdown
          output: lychee/out.md
          jobSummary: true
          args: >-
            --root-dir .
            --no-progress
            --max-redirects 5
            --max-concurrency 16
            --timeout 20
            --exclude-mail
            --include-fragments
            ./docs/.vitepress/dist/**/*.html
