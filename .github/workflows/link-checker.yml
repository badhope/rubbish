name: Link Checker

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install lychee
        run: |
          curl -sSfL https://github.com/lycheeverse/lychee/releases/latest/download/lychee-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C /usr/local/bin lychee

      - name: Build site
        run: |
          npm ci
          npm run docs:build

      - name: Run lychee
        run: |
          lychee \
            --offline \
            --no-progress \
            --exclude 'https://github.com/badhope/ScholarLib/edit/*' \
            --exclude 'https://doi.org/*' \
            --exclude 'https://orcid.org/*' \
            --exclude-mail \
            --include-fragments \
            --max-redirects 5 \
            --max-concurrency 16 \
            --timeout 20 \
            ./docs/.vitepress/dist/**/*.html
