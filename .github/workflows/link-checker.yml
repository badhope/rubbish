name: Link Checker

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install lychee
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 --retry-delay 2 --retry-all-errors \
            -o /tmp/lychee.tar.gz \
            https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz
          tar xzf /tmp/lychee.tar.gz -C /usr/local/bin lychee
          lychee --version

      - name: Build site
        run: |
          npm ci
          npm run docs:build

      - name: Run lychee
        run: |
          lychee \
            --offline \
            --no-progress \
            --exclude 'https://github.com/badhope/ScholarLib/edit/*' \
            --exclude 'https://doi.org/*' \
            --exclude 'https://orcid.org/*' \
            --exclude-mail \
            --include-fragments \
            --max-redirects 5 \
            --max-concurrency 16 \
            --timeout 20 \
            ./docs/.vitepress/dist/**/*.html
