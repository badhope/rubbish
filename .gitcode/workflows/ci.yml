# GitCode pipeline: build and test gates for main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: checkout
      - name: Setup Python
        uses: setup-python
        with:
          python-version: "3.12"
      - name: Install uv
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          python3 -m pip install --user uv -i https://pypi.tuna.tsinghua.edu.cn/simple \
            || curl -LsSf https://astral.sh/uv/install.sh | sh
          uv --version
      - name: Sync dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd apps/backend
          uv sync --group dev --frozen
      - name: Lint and type check
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd apps/backend
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy app --exclude 'app/domain/submission' --exclude 'app/domain/ingest' --exclude 'app/interfaces/http/submission' --exclude 'app/interfaces/http/review'
      - name: Tests
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd apps/backend
          uv run pytest -q -n auto

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: checkout
      - name: Setup Node
        uses: setup-node
        with:
          node-version: "22"
      - name: Install dependencies
        run: cd apps/frontend && npm ci --registry=https://registry.npmjs.org
      - name: Lint
        run: cd apps/frontend && npm run lint
      - name: Type check
        run: cd apps/frontend && npm run typecheck
      - name: Unit tests
        run: cd apps/frontend && npm run test -- --maxWorkers=2
      - name: Build
        run: cd apps/frontend && npm run build
