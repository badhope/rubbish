# Journal tier classification
journal_tiers:
  - FT50-UTD24        # Financial Times Top 50 & UTD 24
  - SSCI-Q1           # SSCI Q1 journals
  - SCI-Q1            # SCI Q1 journals
  - CSSCI             # Chinese Social Science Citation Index
  - Other-Top         # ABS 3/4, ABDC A*, etc.

# Research methodology classification
methods:
  - empirical         # Empirical studies (archival, survey, secondary data)
  - theoretical       # Theory building, conceptual, analytical models
  - meta-analysis     # Meta-analyses, systematic reviews with effect sizes
  - review            # Literature reviews, systematic reviews
  - experimental      # Lab experiments, field experiments, RCTs

# Industry scenario classification
scenarios:
  - cross-industry                        # Cross-industry, generalizable findings
  - technology-internet                   # Tech companies, internet platforms, AI, software
  - manufacturing                         # Manufacturing, production, supply chain
  - finance-banking                       # Banking, insurance, investment, fintech
  - healthcare-pharma                     # Hospitals, pharma, healthcare systems
  - education                             # Schools, universities, edtech
  - government-public                     # Government agencies, public administration
  - retail-consumer-goods                 # Retail, e-commerce, FMCG
  - energy-utilities                      # Energy, oil & gas, utilities
  - real-estate-construction              # Real estate, construction, infrastructure
  - consulting-professional-services      # Consulting, law, accounting firms
  - agriculture-food                      # Agriculture, food industry

# Year range
years:
  - 2020
  - 2021
  - 2022
  - 2023
  - 2024
  - 2025
  - 2026

# Paper entry format
paper_format:
  - "{paper-name}.bib"
  - "metadata.json"

# Statistics
stats:
  total_papers: 45
  total_fields: 18
  total_topics: 72
  journal_tiers: 5
  methods: 5
  scenarios: 12

