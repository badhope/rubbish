name: ScholarLib-EM
description: Curated open-access research papers in Economics & Management
url: https://github.com/badhope/ScholarLib-EM

# Repository settings
owner: badhope
repo: ScholarLib-EM
default_branch: main

# 6-level taxonomy: Year → Field → Topic → Journal Tier → Method → Industry Scenario
taxonomy:
  levels:
    - name: year
      description: Publication year
    - name: field
      description: Research field (18 fields)
    - name: topic
      description: Research topic within field (3-5 per field)
    - name: journal_tier
      description: Journal quality tier (5 tiers)
    - name: method
      description: Research methodology (5 types)
    - name: scenario
      description: Industry application scenario (12 scenarios)

# Research fields (18 total)
categories:
  # Core Economics & Management (10)
  - microeconomics
  - macroeconomics
  - finance
  - accounting
  - marketing
  - strategic-management
  - operations-management
  - innovation-entrepreneurship
  - human-resources
  - public-economics
  # Extended Fields (8)
  - behavioral-economics
  - labor-economics
  - digital-economy
  - esg-sustainability
  - international-business
  - health-economics
  - tourism-hospitality
  - real-estate-urban-economics

